<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live OP — AarohCare</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Live OP status of your AarohCare booking." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f5f8fc; --card: #ffffff; --line: #e2e8f0; --text: #0f172a; --muted: #64748b;
        --blue: #007fff; --navy: #0b2a4a; --red: #dc2626; --red-soft: #fff1f1; --red-line: #fecaca;
        --amber: #c2410c; --amber-soft: #fff7ed; --amber-line: #fed7aa;
        --green: #15803d; --green-soft: #f0fdf4; --green-line: #bbf7d0;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .wrap { max-width: 460px; margin: 0 auto; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 14px; }
      .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
      .brand img { width: 34px; height: 34px; border-radius: 9px; }
      .brand b { font-family: 'Outfit', sans-serif; font-size: 17px; }
      .brand span { display: block; font-size: 11px; color: var(--muted); }
      .head .fac { font-size: 13px; font-weight: 700; color: var(--muted); }
      .head .doc { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; margin-top: 2px; }
      .head .spec { font-size: 13px; color: var(--muted); }
      .live { background: linear-gradient(180deg, #fff7f7, #ffecec); border: 1px solid var(--red-line); border-radius: 22px; padding: 18px; text-align: center; }
      .live .k { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--red); }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); position: relative; }
      .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--red); animation: ping 1.4s infinite; }
      @keyframes ping { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(2.6); opacity: 0; } }
      .live .v { font-family: 'Outfit', sans-serif; font-size: 84px; font-weight: 900; color: var(--red); line-height: 1; margin-top: 6px; }
      .live .sub { font-size: 13px; font-weight: 600; color: #7f1d1d; margin-top: 6px; }
      .mine { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; align-items: center; justify-content: space-between; }
      .mine .k { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
      .mine .name { font-size: 15px; font-weight: 700; margin-top: 2px; }
      .mine .v { font-family: 'Outfit', sans-serif; font-size: 40px; font-weight: 900; color: var(--navy); }
      .status { border-radius: 14px; padding: 11px 13px; font-size: 13.5px; font-weight: 600; line-height: 1.45; }
      .wait { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-line); }
      .ok { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-line); }
      .info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
      .off { background: #f1f5f9; color: #334155; border: 1px solid var(--line); }
      .meta { font-size: 11.5px; color: #94a3b8; text-align: center; }
      .center { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) { .dot::after { animation: none; } }
    </style>
  </head>
  <body>
    <main class="wrap">
      <a class="brand" href="/"><img src="/aarohcare-logo.png" alt="" /><div><b>AarohCare</b><span>Live OP</span></div></a>

      <div id="loading" class="center">Loading your Live OP…</div>
      <div id="error" class="status off" hidden></div>

      <section id="view" hidden>
        <div class="head">
          <div class="fac" id="fac"></div>
          <div class="doc" id="doc"></div>
          <div class="spec" id="spec"></div>
        </div>

        <div class="live" id="liveBox" style="margin-top:14px">
          <div class="k"><span class="dot"></span>LIVE OP</div>
          <div class="v" id="live">—</div>
          <div class="sub" id="liveSub"></div>
        </div>

        <div class="mine" style="margin-top:14px">
          <div><div class="k">YOUR TOKEN</div><div class="name" id="patient"></div></div>
          <div class="v" id="token"></div>
        </div>

        <div class="status" id="state" style="margin-top:14px"></div>
        <div class="meta" id="updated" style="margin-top:14px"></div>
      </section>
    </main>

    <script>
      (function () {
        var code = (location.pathname.split('/').filter(Boolean)[1] || '').trim();
        // Codes from the test backend start with "0" (never used in production codes).
        var api = code.charAt(0) === '0' ? 'https://test-api.aarohcare.com/api' : 'https://staging-api.aarohcare.com/api';
        var $ = function (id) { return document.getElementById(id); };
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        var timer = null;

        function dateLabel(ymd) {
          var p = ymd.split('-').map(Number);
          var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
          return days[d.getUTCDay()] + ', ' + p[2] + ' ' + months[p[1] - 1] + ' ' + p[0];
        }
        function clock(hm) {
          if (!hm) return '';
          var p = hm.split(':').map(Number);
          var h = p[0] % 12 || 12;
          return h + ':' + String(p[1] || 0).padStart(2, '0') + (p[0] < 12 ? ' AM' : ' PM');
        }
        function drName(name) { return 'Dr. ' + String(name || '').replace(/^dr(\.\s*|\s+)/i, '').trim(); }
        function setState(cls, text) { var el = $('state'); el.className = 'status ' + cls; el.textContent = text; el.hidden = !text; }

        function render(s) {
          $('loading').hidden = true; $('error').hidden = true; $('view').hidden = false;
          $('fac').textContent = s.facilityName + ' · ' + dateLabel(s.date);
          $('doc').textContent = drName(s.doctorName);
          $('spec').textContent = s.specialization || '';
          $('patient').textContent = s.patientName || '';
          $('token').textContent = s.tokenNumber || '—';
          var today = s.state === 'today';
          $('liveBox').hidden = !today;
          if (today) {
            $('live').textContent = s.liveOpNumber > 0 ? s.liveOpNumber : '—';
            var time = s.startTime && s.endTime ? clock(s.startTime) + ' – ' + clock(s.endTime) : '';
            $('liveSub').textContent = s.onBreak ? 'Doctor is on a break' : s.liveOpNumber > 0 ? 'Now serving' : 'OP has not started yet' + (time ? ' · ' + time : '');
          }
          if (s.state === 'today') {
            if (s.isClosed && s.liveOpNumber === 0) setState('off', 'Booking is closed for today.');
            else if (s.arrived) setState('ok', '✅ You are marked as arrived. Please wait for your turn.');
            else setState('wait', '⏳ Not arrived yet – please reach the clinic and tell the reception.');
          } else if (s.state === 'upcoming') setState('info', '📅 Your booking is on ' + dateLabel(s.date) + '. Live OP starts that day.');
          else if (s.state === 'consulted') setState('ok', '✅ Your consultation is done. Get well soon!');
          else if (s.state === 'cancelled') setState('off', '❌ This booking is cancelled.');
          else setState('off', 'This OP day has ended.');
          $('updated').textContent = today ? 'Updates by itself · last checked ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'Powered by AarohCare';
          return today;
        }

        function showError(text) {
          $('loading').hidden = true; $('view').hidden = true;
          var el = $('error'); el.hidden = false; el.textContent = text;
        }

        function load() {
          if (!/^[A-Za-z0-9]{6,24}$/.test(code)) { showError('This Live OP link is not valid.'); return; }
          fetch(api + '/public/op/' + encodeURIComponent(code), { headers: { Accept: 'application/json' } })
            .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
            .then(function (r) {
              if (!r.ok) { showError((r.body && r.body.message) || 'This Live OP link is not valid.'); return; }
              var data = r.body && (r.body.data || r.body);
              var live = render(data);
              clearTimeout(timer);
              if (live) timer = setTimeout(load, 15000);
            })
            .catch(function () {
              if ($('view').hidden) showError('Could not load the Live OP. Check your internet and refresh.');
              clearTimeout(timer);
              timer = setTimeout(load, 20000);
            });
        }

        document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
        load();
      })();
    </script>
  </body>
</html>
