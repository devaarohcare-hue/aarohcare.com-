<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live OP — AarohCare</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Live OP status of your AarohCare booking." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f5f8fc; --card: #ffffff; --line: #e5e7eb; --text: #1a1a1a; --muted: #6b7280;
        --blue: #007fff; --blue-soft: #e6f2ff; --green: #10b981; --grey: #94a3b8;
        --ok: #15803d; --ok-soft: #e8f8ee; --ok-line: #bbf7d0;
        --warn: #b45309; --warn-soft: #fff6e5; --warn-line: #fed7aa;
        --info: #1d4ed8; --info-soft: #eff6ff; --info-line: #bfdbfe;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .wrap { max-width: 460px; margin: 0 auto; padding: 18px 16px 32px; display: flex; flex-direction: column; gap: 14px; }
      .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
      .brand img { width: 34px; height: 34px; border-radius: 9px; }
      .brand b { font-family: 'Outfit', sans-serif; font-size: 17px; }
      .brand span { display: block; font-size: 11px; color: var(--muted); }

      .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: 0 8px 22px -16px rgba(11, 61, 117, 0.35); display: flex; flex-direction: column; gap: 14px; }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
      .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 4px 11px; }
      .pill.live { background: var(--ok-soft); color: var(--ok); }
      .pill.live i { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; display: inline-block; animation: blink 1.4s infinite; }
      .pill.soon { background: var(--blue-soft); color: #005fcc; }
      .pill.done { background: #f1f5f9; color: #334155; }
      @keyframes blink { 50% { opacity: 0.35; } }
      .date { font-size: 12.5px; font-weight: 700; color: #475569; }

      .doc { display: flex; gap: 12px; align-items: center; }
      .ph { width: 58px; height: 58px; border-radius: 16px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; font-weight: 900; font-size: 22px; flex: none; overflow: hidden; }
      .ph img { width: 100%; height: 100%; object-fit: cover; }
      .dn { font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 800; }
      .ds { font-size: 13px; color: var(--blue); margin-top: 1px; }
      .df { font-size: 14.5px; font-weight: 700; margin-top: 3px; }

      .row { display: flex; gap: 12px; }
      .box { flex: 1; border-radius: 18px; padding: 14px 10px; text-align: center; color: #fff; }
      .box.blue { background: var(--blue); }
      .box.green { background: var(--green); }
      .box.grey { background: var(--grey); }
      .box .k { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; opacity: 0.95; }
      .box .v { font-family: 'Outfit', sans-serif; font-size: 40px; font-weight: 900; line-height: 1.1; margin-top: 2px; }
      .box .s { font-size: 11.5px; font-weight: 700; opacity: 0.95; min-height: 15px; }

      .status { border-radius: 14px; padding: 11px 13px; font-size: 13.5px; font-weight: 600; line-height: 1.45; }
      .wait { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
      .ok { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line); }
      .info { background: var(--info-soft); color: var(--info); border: 1px solid var(--info-line); }
      .off { background: #f1f5f9; color: #334155; border: 1px solid var(--line); }
      .meta { font-size: 11.5px; color: #94a3b8; text-align: center; }
      .center { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) { .pill.live i { animation: none; } }
    </style>
  </head>
  <body>
    <main class="wrap">
      <a class="brand" href="/"><img src="/aarohcare-logo.png" alt="" /><div><b>AarohCare</b><span>Live OP</span></div></a>

      <div id="loading" class="center">Loading your Live OP…</div>
      <div id="error" class="status off" hidden></div>

      <section id="view" class="card" hidden>
        <div class="top"><span class="pill" id="pill"></span><span class="date" id="when"></span></div>
        <div class="doc">
          <div class="ph" id="photo"></div>
          <div><div class="dn" id="doc"></div><div class="ds" id="spec"></div><div class="df" id="fac"></div></div>
        </div>
        <div class="row">
          <div class="box" id="liveBox"><div class="k">🔊 LIVE OP</div><div class="v" id="live">—</div><div class="s" id="liveSub"></div></div>
          <div class="box green"><div class="k">👤 YOUR OP</div><div class="v" id="token">—</div><div class="s"></div></div>
        </div>
        <div class="status" id="state"></div>
      </section>
      <div class="meta" id="updated"></div>
    </main>

    <script>
      (function () {
        var code = (location.pathname.split('/').filter(Boolean)[1] || '').trim();
        // Codes from the test backend start with "0" (never used in production codes).
        var api = code.charAt(0) === '0' ? 'https://test-api.aarohcare.com/api' : 'https://staging-api.aarohcare.com/api';
        var $ = function (id) { return document.getElementById(id); };
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        var timer = null;

        function parts(ymd) { var p = ymd.split('-').map(Number); return { y: p[0], m: p[1], d: p[2], w: new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay() }; }
        function dateLabel(ymd) { var p = parts(ymd); return days[p.w] + ', ' + p.d + ' ' + months[p.m - 1] + ' ' + p.y; }
        function shortDate(ymd) { var p = parts(ymd); return p.d + ' ' + months[p.m - 1]; }
        function clock(hm) {
          if (!hm) return '';
          var p = hm.split(':').map(Number);
          return (p[0] % 12 || 12) + ':' + String(p[1] || 0).padStart(2, '0') + (p[0] < 12 ? ' AM' : ' PM');
        }
        function cleanName(name) { return String(name || '').replace(/^dr(\.\s*|\s+)/i, '').trim(); }
        function setPill(cls, html) { var el = $('pill'); el.className = 'pill ' + cls; el.innerHTML = html; }
        function setState(cls, text) { var el = $('state'); el.className = 'status ' + cls; el.textContent = text; }

        function render(s) {
          $('loading').hidden = true; $('error').hidden = true; $('view').hidden = false;
          var today = s.state === 'today';
          var time = s.startTime && s.endTime ? clock(s.startTime) + ' – ' + clock(s.endTime) : '';

          $('when').textContent = (today ? 'Today' : dateLabel(s.date)) + (time ? ' · ' + time : '');
          var name = cleanName(s.doctorName);
          var photo = $('photo');
          photo.textContent = '';
          if (s.doctorImage) {
            var img = document.createElement('img');
            img.alt = ''; img.src = s.doctorImage;
            img.onerror = function () { photo.textContent = (name[0] || 'D').toUpperCase(); };
            photo.appendChild(img);
          } else {
            photo.textContent = (name[0] || 'D').toUpperCase();
          }
          $('doc').textContent = 'Dr. ' + name;
          $('spec').textContent = (s.specialization || 'General OP') + (today && s.onBreak ? ' · On break' : '');
          $('fac').textContent = '📍 ' + s.facilityName;
          $('token').textContent = s.tokenNumber || '—';

          var liveBox = $('liveBox');
          if (today) {
            liveBox.className = 'box blue';
            $('live').textContent = s.liveOpNumber > 0 ? s.liveOpNumber : '—';
            $('liveSub').textContent = s.onBreak ? '☕ Break' : s.liveOpNumber > 0 ? '' : 'Not started';
          } else {
            liveBox.className = 'box grey';
            $('live').textContent = '—';
            $('liveSub').textContent = s.state === 'upcoming' ? 'Starts on ' + shortDate(s.date) : '';
          }

          if (today) {
            setPill('live', '<i></i>Live tracking');
            if (s.isClosed && s.liveOpNumber === 0) setState('off', 'Booking is closed for today.');
            else if (s.arrived) setState('ok', '✅ You are marked as arrived. Please wait for your turn.');
            else setState('wait', '⏳ Not arrived yet – please reach the clinic and tell the reception.');
          } else if (s.state === 'upcoming') {
            setPill('soon', 'Upcoming');
            setState('info', '📅 Your booking is on ' + dateLabel(s.date) + '. Live OP starts that day.');
          } else if (s.state === 'consulted') {
            setPill('done', 'Consulted');
            setState('ok', '✅ Your consultation is done. Get well soon!');
          } else if (s.state === 'cancelled') {
            setPill('done', 'Cancelled');
            setState('off', '❌ This booking is cancelled.');
          } else {
            setPill('done', 'Ended');
            setState('off', 'This OP day has ended.');
          }

          var who = s.patientName ? s.patientName + ' · ' : '';
          $('updated').textContent = today
            ? who + 'Updates by itself · last checked ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
            : who + 'Powered by AarohCare';
          return today;
        }

        function showError(text) {
          $('loading').hidden = true; $('view').hidden = true;
          var el = $('error'); el.hidden = false; el.textContent = text;
        }

        function load() {
          if (!/^[A-Za-z0-9]{6,24}$/.test(code)) { showError('This Live OP link is not valid.'); return; }
          fetch(api + '/public/op/' + encodeURIComponent(code), { headers: { Accept: 'application/json' } })
            .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
            .then(function (r) {
              if (!r.ok) { showError((r.body && r.body.message) || 'This Live OP link is not valid.'); return; }
              var live = render(r.body && (r.body.data || r.body));
              clearTimeout(timer);
              if (live) timer = setTimeout(load, 15000);
            })
            .catch(function () {
              if ($('view').hidden) showError('Could not load the Live OP. Check your internet and refresh.');
              clearTimeout(timer);
              timer = setTimeout(load, 20000);
            });
        }

        document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
        load();
      })();
    </script>
  </body>
</html>
