<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live OP — AarohCare</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Live OP status of your AarohCare booking." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #eef3fb; --ink: #13213d; --muted: #475569; --card: #ffffff;
        --soft: #eef4fd; --chip: #dce8fa; --chip-ink: #1e40af;
        --live-bg: #dce8fd; --live-ink: #1e3a8a;
        --mine-bg: #d5f2e3; --mine-ink: #065f46;
        --dim-bg: #e5e9f0; --dim-ink: #64748b;
        --foot: #eef2f8;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .wrap { max-width: 440px; margin: 0 auto; padding: 22px 16px 32px; display: flex; flex-direction: column; gap: 18px; }

      .top { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; }
      .top h1 { grid-column: 2; margin: 0; text-align: center; font-size: 19px; font-weight: 800; line-height: 1.25; }
      .refresh { grid-column: 3; width: 48px; height: 48px; border-radius: 15px; background: var(--chip); border: 0; display: grid; place-items: center; cursor: pointer; }
      .refresh:focus-visible { outline: 2px solid var(--chip-ink); outline-offset: 2px; }
      .refresh svg { width: 24px; height: 24px; }
      .refresh.spin svg { animation: spin 0.7s linear; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .card { background: var(--card); border: 2px solid var(--ink); border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
      .doc { background: var(--soft); border-radius: 20px; padding: 14px; display: flex; gap: 14px; align-items: center; }
      .ph { width: 70px; height: 70px; border-radius: 18px; background: linear-gradient(160deg, #dce8fa, #f4f7fc); display: grid; place-items: center; font-weight: 800; font-size: 28px; color: var(--chip-ink); flex: none; overflow: hidden; }
      .ph img { width: 100%; height: 100%; object-fit: cover; }
      .info { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
      .dn { font-size: 21px; font-weight: 800; line-height: 1.2; }
      .chip { font-size: 12.5px; font-weight: 700; color: var(--chip-ink); background: var(--chip); border-radius: 999px; padding: 5px 12px; }
      .time { font-size: 12.5px; font-weight: 600; color: #334155; background: #fff; border-radius: 999px; padding: 5px 12px; }

      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .box { border-radius: 22px; padding: 16px 8px 12px; text-align: center; }
      .box .k { font-size: 15px; font-weight: 800; letter-spacing: 0.02em; }
      .box .v { font-size: 60px; font-weight: 800; line-height: 1.05; margin-top: 4px; transition: transform 0.25s ease; }
      .box .s { font-size: 12px; font-weight: 700; min-height: 16px; }
      .live { background: var(--live-bg); color: var(--live-ink); }
      .mine { background: var(--mine-bg); color: var(--mine-ink); }
      .dim { background: var(--dim-bg); color: var(--dim-ink); }
      .bump .v { transform: scale(1.12); }

      .msg { border-radius: 14px; padding: 10px 12px; font-size: 13px; font-weight: 700; text-align: center; background: #e0ecff; color: #1d4ed8; }
      .msg.off { background: var(--foot); color: var(--muted); }
      .foot { background: var(--foot); border-radius: 999px; padding: 10px 14px; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--muted); }
      .center { text-align: center; padding: 48px 0; color: var(--muted); font-size: 14px; }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) { .refresh.spin svg { animation: none; } .box .v { transition: none; } }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="top">
        <h1 id="fac">Live OP</h1>
        <button class="refresh" id="refresh" type="button" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6" /><path d="M20 4v5h-5" /></svg>
        </button>
      </div>

      <div id="loading" class="center">Loading your Live OP…</div>
      <div id="error" class="msg off" hidden></div>

      <section id="view" class="card" hidden>
        <div class="doc">
          <div class="ph" id="photo"></div>
          <div class="info">
            <div class="dn" id="doc"></div>
            <span class="chip" id="spec"></span>
            <span class="time" id="when"></span>
          </div>
        </div>
        <div class="row">
          <div class="box live" id="liveBox"><div class="k">LIVE OP</div><div class="v" id="live">—</div><div class="s" id="liveSub"></div></div>
          <div class="box mine"><div class="k">YOUR OP</div><div class="v" id="token">—</div><div class="s"></div></div>
        </div>
        <div class="msg" id="state" hidden></div>
        <div class="foot" id="foot"></div>
      </section>
    </main>

    <script>
      (function () {
        var POLL_MS = 3000;
        var code = (location.pathname.split('/').filter(Boolean)[1] || '').trim();
        // Codes from the test backend start with "0" (never used in production codes).
        var api = code.charAt(0) === '0' ? 'https://test-api.aarohcare.com/api' : 'https://staging-api.aarohcare.com/api';
        var $ = function (id) { return document.getElementById(id); };
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        var timer = null, busy = false, lastLive = null, live = false, photoSrc = null;

        function parts(ymd) { var p = ymd.split('-').map(Number); return { m: p[1], d: p[2], w: new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay() }; }
        function dateLabel(ymd) { var p = parts(ymd); return days[p.w] + ', ' + p.d + ' ' + months[p.m - 1]; }
        function shortDate(ymd) { var p = parts(ymd); return p.d + ' ' + months[p.m - 1]; }
        function clock(hm) {
          if (!hm) return '';
          var p = hm.split(':').map(Number);
          return (p[0] % 12 || 12) + ':' + String(p[1] || 0).padStart(2, '0') + (p[0] < 12 ? ' AM' : ' PM');
        }
        function nowLabel() { var d = new Date(); return (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0'); }
        function cleanName(name) { return String(name || '').replace(/^dr(\.\s*|\s+)/i, '').trim(); }

        function setPhoto(s, name) {
          var el = $('photo');
          var initial = (name[0] || 'D').toUpperCase();
          if (!s.doctorImage) { if (photoSrc !== '') { el.textContent = initial; photoSrc = ''; } return; }
          if (photoSrc === s.doctorImage) return; // keep the loaded image between refreshes
          photoSrc = s.doctorImage;
          el.textContent = '';
          var img = document.createElement('img');
          img.alt = '';
          img.src = s.doctorImage;
          img.onerror = function () { el.textContent = initial; };
          el.appendChild(img);
        }

        function render(s) {
          $('loading').hidden = true; $('error').hidden = true; $('view').hidden = false;
          var today = s.state === 'today';
          var time = s.startTime && s.endTime ? clock(s.startTime) + ' – ' + clock(s.endTime) : '';
          var name = cleanName(s.doctorName);

          document.title = (s.facilityName || 'Live OP') + ' — Live OP';
          $('fac').textContent = s.facilityName || 'Live OP';
          setPhoto(s, name);
          $('doc').textContent = 'Dr. ' + name;
          $('spec').textContent = s.specialization || 'General OP';
          $('when').textContent = (today ? 'Today' : dateLabel(s.date)) + (time ? ' · ' + time : '');
          $('token').textContent = s.tokenNumber || '—';

          var box = $('liveBox');
          var liveValue = today && s.liveOpNumber > 0 ? String(s.liveOpNumber) : '—';
          box.className = 'box ' + (today ? 'live' : 'dim');
          if (lastLive !== null && liveValue !== lastLive) {
            box.classList.add('bump');
            setTimeout(function () { box.classList.remove('bump'); }, 260);
          }
          lastLive = liveValue;
          $('live').textContent = liveValue;
          $('liveSub').textContent = today
            ? (s.onBreak ? 'On break' : s.liveOpNumber > 0 ? '' : 'Not started')
            : (s.state === 'upcoming' ? 'Starts on ' + shortDate(s.date) : '');

          var msg = $('state');
          var text = '';
          if (today && s.isClosed && s.liveOpNumber === 0) text = 'Booking is closed for today.';
          else if (s.state === 'upcoming') text = 'Your booking is on ' + dateLabel(s.date) + '.';
          else if (s.state === 'consulted') text = 'Consultation done. Get well soon!';
          else if (s.state === 'cancelled') text = 'This booking is cancelled.';
          else if (s.state === 'ended') text = 'This OP day has ended.';
          msg.textContent = text;
          msg.className = 'msg' + (s.state === 'upcoming' ? '' : ' off');
          msg.hidden = !text;

          var who = s.patientName ? s.patientName + ' · ' : '';
          $('foot').textContent = today ? who + 'Auto-updates · Last checked ' + nowLabel() : who + 'AarohCare';
          return today;
        }

        function showError(text) {
          $('loading').hidden = true; $('view').hidden = true;
          var el = $('error'); el.hidden = false; el.textContent = text;
        }

        function schedule() {
          clearTimeout(timer);
          if (live && !document.hidden) timer = setTimeout(load, POLL_MS);
        }

        function load() {
          if (busy) return;
          if (!/^[A-Za-z0-9]{6,24}$/.test(code)) { showError('This Live OP link is not valid.'); return; }
          busy = true;
          fetch(api + '/public/op/' + encodeURIComponent(code), { headers: { Accept: 'application/json' }, cache: 'no-store' })
            .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
            .then(function (r) {
              if (!r.ok) { live = false; showError((r.body && r.body.message) || 'This Live OP link is not valid.'); return; }
              live = render(r.body && (r.body.data || r.body));
            })
            .catch(function () {
              if ($('view').hidden) showError('Could not load the Live OP. Check your internet and refresh.');
              live = true; // keep trying while the page is open
            })
            .then(function () { busy = false; schedule(); });
        }

        $('refresh').addEventListener('click', function () {
          var btn = $('refresh');
          btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');
          clearTimeout(timer);
          load();
        });
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) clearTimeout(timer);
          else load();
        });
        load();
      })();
    </script>
  </body>
</html>
